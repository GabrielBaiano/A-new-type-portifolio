<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Admin | Gabriel Baiano</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --purple: #a855f7;
            --blue: #3b82f6;
            --bg: #0a0a0a;
            --sidebar: #111111;
            --card: #141414;
            --border: rgba(255, 255, 255, 0.1);
            --text: #ffffff;
            --text-muted: #888;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            display: grid;
            grid-template-columns: 350px 1fr 400px;
            width: 100%;
            height: 100%;
            background: var(--border);
            gap: 1px;
        }

        .panel {
            background: var(--bg);
            height: 100%;
            overflow-y: auto;
            padding: 30px;
        }

        /* Inventory Panel */
        .inventory-panel {
            background: var(--sidebar);
            border-right: 1px solid var(--border);
        }

        .inventory-list {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .inventory-item {
            position: relative;
            aspect-ratio: 1;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            border: 1px solid var(--border);
            cursor: pointer;
            overflow: hidden;
            transition: all 0.2s;
        }

        .inventory-item:hover {
            border-color: var(--blue);
            transform: scale(0.98);
        }

        .inventory-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .inventory-item.active {
            border-color: var(--blue);
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.3);
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .btn-new {
            background: var(--blue);
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.8rem;
        }

        h1 {
            font-family: 'Sora', sans-serif;
            font-weight: 800;
            font-size: 1.2rem;
            margin-bottom: 20px;
            color: var(--blue);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: white;
            font-size: 0.95rem;
            transition: all 0.3s;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: var(--blue);
        }

        textarea {
            height: 100px;
        }

        .btn-post {
            width: 100%;
            padding: 18px;
            background: var(--blue);
            color: white;
            border: none;
            border-radius: 14px;
            font-family: 'Sora', sans-serif;
            font-weight: 800;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-post:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(59, 130, 246, 0.3);
        }

        .preview-card {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            border: 1px solid var(--border);
            margin-bottom: 20px;
            overflow: hidden;
            position: relative;
        }

        .preview-card img {
            width: 100%;
            display: block;
        }

        .preview-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.8), transparent);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .preview-desc {
            color: white;
            margin: 0;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .preview-link-icon {
            align-self: flex-start;
            color: white;
            background: rgba(255, 255, 255, 0.2);
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            backdrop-filter: blur(5px);
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 0.7rem;
            font-weight: 800;
            margin-top: 10px;
        }

        .success {
            background: rgba(34, 197, 94, 0.1);
            color: #22c55e;
        }

        .error {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
        }

        @media (max-width: 1100px) {
            .container {
                grid-template-columns: 1fr;
            }

            body {
                height: auto;
                overflow: visible;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- Panel 1: Inventory -->
        <div class="panel inventory-panel">
            <div class="section-header">
                <h1>📸 Photos</h1>
                <button class="btn-new" onclick="createNew()">+ New Photo</button>
            </div>
            <div id="inventory-list" class="inventory-list">
                <p style="color: grey; font-size: 0.8rem;">Loading inventory...</p>
            </div>
        </div>

        <!-- Panel 2: Editor -->
        <div class="panel editor-panel">
            <h1>✍️ Photo Editor</h1>
            <form id="photoForm">
                <input type="hidden" id="photo-id">

                <div class="form-group">
                    <label>Image URL</label>
                    <input type="url" id="image_url" required placeholder="https://external-link.com/photo.jpg">
                    <p style="color: grey; font-size: 0.7rem; margin-top: 5px;">Tip: Host on Pinterest/Unsplash/Imgur
                        and paste link here.</p>
                </div>

                <div class="form-group">
                    <label>Description (Overlay Text)</label>
                    <textarea id="description" placeholder="A brief description of this inspiration..."></textarea>
                </div>

                <div class="form-group">
                    <label>External Link (Where it goes on click)</label>
                    <input type="url" id="link" placeholder="https://pinterest.com/pin/...">
                </div>

                <div class="form-group">
                    <label>Admin Secret</label>
                    <input type="password" id="secret" required placeholder="••••••••••••">
                </div>

                <button type="submit" id="submit-btn" class="btn-post">SALVAR FOTO 🚀</button>
            </form>
            <div id="status-msg"></div>
        </div>

        <!-- Panel 3: Preview -->
        <div class="panel preview-panel">
            <h1>👀 Live Preview</h1>
            <div class="preview-card">
                <img id="prev-img" src="https://via.placeholder.com/400x600?text=Paste+URL" alt="Preview">
                <div id="prev-overlay" class="preview-overlay">
                    <p id="prev-desc" class="preview-desc">Add a description to see it here.</p>
                    <div id="prev-link" class="preview-link-icon"><i class="fa-solid fa-arrow-up-right-from-square"></i>
                    </div>
                </div>
            </div>

            <p style="color: grey; font-size: 0.8rem; text-transform: uppercase; font-weight: 700;">Masonry Behavior</p>
            <p style="color: #666; font-size: 0.85rem;">The vertical height will adjust automatically to create the
                waterfall effect in the portifolio.</p>
        </div>
    </div>

    <script>
        const form = document.getElementById('photoForm');
        const urlInput = document.getElementById('image_url');
        const descInput = document.getElementById('description');
        const linkInput = document.getElementById('link');
        const idInput = document.getElementById('photo-id');
        const inventoryEl = document.getElementById('inventory-list');

        let allPhotos = [];

        async function fetchPhotos() {
            try {
                const res = await fetch('/api/get-photos');
                const result = await res.json();
                allPhotos = result.data || [];
                renderInventory();
            } catch (err) {
                console.error('Failed to fetch photos:', err);
                inventoryEl.innerHTML = '<p style="color:red">Error loading photos.</p>';
            }
        }

        function renderInventory() {
            if (allPhotos.length === 0) {
                inventoryEl.innerHTML = '<p style="color:grey; grid-column: 1/-1;">Empty gallery.</p>';
                return;
            }

            inventoryEl.innerHTML = allPhotos.map(p => `
                <div class="inventory-item ${idInput.value === p.id ? 'active' : ''}" onclick="editPhoto('${p.id}')">
                    <img src="${p.image_url}" alt="">
                </div>
            `).join('');
        }

        function editPhoto(id) {
            const photo = allPhotos.find(p => p.id === id);
            if (!photo) return;

            idInput.value = photo.id;
            urlInput.value = photo.image_url;
            descInput.value = photo.description || '';
            linkInput.value = photo.link || '';

            document.getElementById('submit-btn').innerText = 'ATUALIZAR FOTO 💾';
            updatePreview();
            renderInventory();
        }

        function createNew() {
            idInput.value = '';
            form.reset();
            document.getElementById('submit-btn').innerText = 'SALVAR NOVA FOTO 🚀';
            updatePreview();
            renderInventory();
        }

        function updatePreview() {
            const url = urlInput.value || 'https://via.placeholder.com/400x600?text=Paste+URL';
            document.getElementById('prev-img').src = url;

            const desc = descInput.value;
            const descEl = document.getElementById('prev-desc');
            const overlayEl = document.getElementById('prev-overlay');
            const linkEl = document.getElementById('prev-link');

            if (desc) {
                descEl.innerText = desc;
                descEl.style.display = 'block';
                overlayEl.style.background = 'linear-gradient(to top, rgba(0,0,0,0.8), transparent)';
            } else {
                descEl.style.display = 'none';
                overlayEl.style.background = 'transparent';
            }

            linkEl.style.display = linkInput.value ? 'flex' : 'none';
        }

        [urlInput, descInput, linkInput].forEach(el => {
            el.addEventListener('input', updatePreview);
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const statusMsg = document.getElementById('status-msg');
            const btn = document.getElementById('submit-btn');

            statusMsg.style.display = 'none';
            btn.disabled = true;

            const payload = {
                id: idInput.value || null,
                image_url: urlInput.value,
                description: descInput.value,
                link: linkInput.value,
                secret: document.getElementById('secret').value
            };

            try {
                const response = await fetch('/api/add-photo', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();

                if (response.ok) {
                    statusMsg.className = 'status-badge success';
                    statusMsg.innerText = 'Foto salva com sucesso! 🎉';
                    statusMsg.style.display = 'block';

                    fetchPhotos(); // Reload
                    if (!idInput.value) {
                        createNew(); // Reset if new
                    }
                } else {
                    throw new Error(result.error || 'Check secret key');
                }
            } catch (err) {
                statusMsg.className = 'status-badge error';
                statusMsg.innerText = 'Erro: ' + err.message;
                statusMsg.style.display = 'block';
            } finally {
                btn.disabled = false;
            }
        });

        // Initial Load
        fetchPhotos();
    </script>
</body>

</html>
