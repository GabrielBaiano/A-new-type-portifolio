<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil Design Engineer</title>
    <!-- Importando ícones (Font Awesome) para os botões sociais e logo -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css?v=3">
</head>

<body>

    <!-- SPA Container -->
    <div id="app" class="main-container">
        <!-- Content will be dynamically loaded here -->
    </div>

    <!-- Bottom Navigation Bar -->
    <nav class="bottom-nav">
        <div class="nav-group main-nav">
            <a href="#/home" class="nav-item active" data-route="home">
                <i class="fa-solid fa-house"></i>
                <span>Home</span>
            </a>
            <a href="#/projects" class="nav-item" data-route="projects">
                <i class="fa-solid fa-cube"></i>
                <span>Projects</span>
            </a>
            <a href="#/tools" class="nav-item" data-route="tools">
                <i class="fa-solid fa-rss"></i>
                <span>Feed</span>
            </a>
            <a href="#/blog" class="nav-item" data-route="blog">
                <i class="fa-solid fa-graduation-cap"></i>
                <span>Academic</span>
            </a>
            <a href="#/photos" class="nav-item" data-route="photos">
                <i class="fa-solid fa-camera"></i>
                <span>Photos</span>
            </a>
        </div>

        <div class="nav-divider"></div>

        <div class="nav-group controls-nav">
            <button id="theme-toggle" class="nav-item icon-only">
                <i class="fa-regular fa-sun"></i>
            </button>
        </div>
    </nav>

    <!-- SPA System -->
    <script src="js/router.js"></script>
    <script src="js/pageManager.js"></script>

    <!-- Data Service -->
    <script src="js/dataService.js"></script>

    <!-- Markdown Parser -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- Page Components -->
    <script src="js/pages/home.js"></script>
    <script src="js/pages/projects.js"></script>
    <script src="js/pages/tools.js"></script>
    <script src="js/pages/blog.js"></script>
    <script src="js/pages/photos.js"></script>
    <script src="js/pages/detail.js"></script>

    <!-- Main Scripts -->
    <script src="js/balloons.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/script.js"></script>
</body>

</html>
