        content="Explore o portfólio de Gabriel Nascimento Gama, Full Stack Developer e Pesquisador.">

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">

<body>
    <!-- Background Drawing Canvas -->
    <canvas id="bg-drawing-canvas"></canvas>

    <!-- Drawing Sidebar (Draggable, Hidden by default, shown when HUD is hidden) -->
    <div id="drawing-sidebar" class="drawing-sidebar">
        <div class="sidebar-handle" id="sidebar-handle">
            <div class="handle-dots"></div>
        </div>

        <div class="sidebar-content">
            <div class="tool-section">
                <span class="section-label">Tools</span>
                <div class="tool-grid">
                    <button id="tool-pencil" class="active" title="Pencil Tool"><i
                            class="fa-solid fa-pencil"></i></button>
                    <button id="tool-spray" title="Spray Tool"><i class="fa-solid fa-spray-can"></i></button>
                    <button id="tool-eraser" title="Eraser Tool"><i class="fa-solid fa-eraser"></i></button>
                    <button id="tool-bucket" title="Bucket Tool (Recolor)"><i
                            class="fa-solid fa-fill-drip"></i></button>
                    <button id="tool-rect" title="Rectangle Tool"><i class="fa-regular fa-square"></i></button>
                    <button id="tool-circle" title="Circle Tool"><i class="fa-regular fa-circle"></i></button>
                    <button id="tool-eyedropper" title="Eyedropper Tool"><i
                            class="fa-solid fa-eye-dropper"></i></button>
                </div>
            </div>

            <div class="sidebar-divider"></div>

            <div class="tool-section">
                <span class="section-label">Colors</span>
                <div class="color-palette-grid">
                    <div class="color-swatch swatch-blue" data-color="#3b82f6" title="Feed Blue"></div>
                    <div class="color-swatch swatch-green" data-color="#22c55e" title="Green"></div>
                    <div class="color-swatch swatch-orange" data-color="#f97316" title="Orange"></div>
                    <div class="color-swatch swatch-pink" data-color="#ec4899" title="Pink"></div>
                    <div class="color-swatch swatch-yellow" data-color="#eab308" title="Yellow"></div>
                    <div class="color-swatch swatch-purple" data-color="#a855f7" title="Purple"></div>
                    <div class="color-swatch swatch-grey" data-color="#333333" title="Grey"></div>
                    <div class="color-custom-btn" id="custom-color-trigger" title="Custom Color">
                        <i class="fa-solid fa-palette"></i>
                        <input type="color" id="draw-color" value="#ffffff">
                    </div>
                </div>
            </div>

            <div class="sidebar-divider"></div>

            <div class="tool-section">
                <div class="options-grid">
                    <button id="draw-undo" title="Undo (Desfazer)" class="undo-btn">
                        <i class="fa-solid fa-rotate-left"></i>
                    </button>
                    <button id="draw-clear" title="Clear Canvas" class="clear-btn">
                        <i class="fa-solid fa-trash-can"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- Pop-out Tool Options Panel -->
        <div id="tool-options-panel" class="tool-options-panel">
            <div class="options-header">
                <span id="active-tool-name">Pencil</span>
            </div>
            <div class="options-content">
                <div class="option-group" id="brush-type-option">
                    <label>Brush Type</label>
                    <div class="options-grid" style="padding: 0;">
                        <button id="brush-standard" class="active" title="Standard Pen">
                            <i class="fa-solid fa-pen-clip"></i>
                        </button>
                        <button id="brush-fountain" title="Fountain Pen (Calligraphy)">
                            <i class="fa-solid fa-pen-fancy"></i>
                        </button>
                    </div>
                </div>
                <div class="option-group">
                    <label>Size</label>
                    <div class="range-with-val">
                        <input type="range" id="draw-size" min="1" max="100" value="4">
                        <span id="size-val">4</span>
                    </div>
                </div>
                <div class="option-group" id="wiggle-option">
                    <label>Wiggle</label>
                    <button id="draw-wiggle-toggle" class="active"><i class="fa-solid fa-wave-square"></i></button>
                </div>
            </div>
        </div>
    </div>

    <!-- Premium Site Loader -->
    <div id="site-loader" class="site-loader">
        <div class="loader-content">
            <div class="loader-orbit">
                <div class="loader-item orbit-triangle">
                    <svg viewBox="0 0 100 86.6" class="symbol-yellow">
                        <polygon points="50,0 100,86.6 0,86.6" />
                    </svg>
                </div>
                <div class="loader-item orbit-circle">
                    <span class="symbol-pink"></span>
                </div>
                <div class="loader-item orbit-square">
                    <span class="symbol-green"></span>
                </div>
            </div>
            <div class="loader-text">LOADING...</div>
        </div>
    </div>

    <!-- SPA Container -->
    <main id="app" class="main-container">
        <!-- Content will be dynamically loaded here -->
    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="bottom-nav">
        <div class="nav-group main-nav">
            <a href="#/feed" class="nav-item active" data-route="feed" aria-label="Feed">
                <i class="fa-solid fa-rss"></i>
                <span>Feed</span>
            </a>
            <a href="#/projects" class="nav-item" data-route="projects" aria-label="Projects">
                <i class="fa-solid fa-cube"></i>
                <span>Projects</span>
            </a>
            <!-- Academic hidden for now -->
            <!-- 
            <a href="#/academic" class="nav-item" data-route="academic" aria-label="Academic">
                <i class="fa-solid fa-graduation-cap"></i>
                <span>Academic</span>
            </a>
            -->


            <a href="#/photos" class="nav-item" data-route="photos" aria-label="Photos">
                <i class="fa-solid fa-camera"></i>
                <span>Photos</span>
            </a>
            <a href="#/home" class="nav-item" data-route="home" aria-label="About Me">
                <i class="fa-solid fa-user"></i>
                <span>About</span>
            </a>
        </div>

        <div class="nav-divider"></div>

        <div class="nav-group controls-nav">
            <button id="hud-toggle" class="nav-item icon-only" title="Toggle HUD visibility">
                <i class="fa-solid fa-eye-slash"></i>
            </button>
            <button id="theme-toggle" class="nav-item icon-only">
                <i class="fa-regular fa-sun"></i>
            </button>
        </div>
    </nav>

    <!-- SPA System -->
    <script src="js/router.js"></script>
    <script src="js/pageManager.js"></script>

    <!-- Data Service -->
    <script src="js/dataService.js"></script>

    <!-- Markdown Parser -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- Leaflet for Map -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <script src="js/pages/home.js"></script>

    <!-- Main Scripts -->
    <script src="js/theme.js"></script>

    <script src="js/drawing.js"></script>
    <script src="js/script.js"></script>
    <script src="js/router.js"></script>
</body>
