<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Review Admin | Gabriel Baiano</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --purple: #a855f7;
            --green: #22c55e;
            --bg: #0a0a0a;
            --sidebar: #111111;
            --card: #141414;
            --border: rgba(255, 255, 255, 0.1);
            --text: #ffffff;
            --text-muted: #888;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            display: grid;
            grid-template-columns: 350px 1fr 400px;
            width: 100%;
            height: 100%;
            background: var(--border);
            gap: 1px;
        }

        .panel {
            background: var(--bg);
            height: 100%;
            overflow-y: auto;
            padding: 30px;
        }

        /* Inventory Panel */
        .inventory-panel {
            background: var(--sidebar);
            border-right: 1px solid var(--border);
        }

        .inventory-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .inventory-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            border: 1px solid var(--border);
            cursor: pointer;
            transition: all 0.2s;
        }

        .inventory-item:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--purple);
        }

        .inventory-item img {
            width: 40px;
            height: 60px;
            object-fit: cover;
            border-radius: 4px;
        }

        .inventory-item-info {
            flex: 1;
            min-width: 0;
        }

        .inventory-item-title {
            font-size: 0.9rem;
            font-weight: 600;
            margin: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .inventory-item-status {
            font-size: 0.7rem;
            text-transform: uppercase;
            font-weight: 800;
            color: var(--text-muted);
        }

        .inventory-item.active {
            border-color: var(--purple);
            background: rgba(168, 85, 247, 0.1);
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .btn-new {
            background: var(--purple);
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.8rem;
        }

        h1 {
            font-family: 'Sora', sans-serif;
            font-weight: 800;
            font-size: 1.2rem;
            margin-bottom: 20px;
            color: var(--purple);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font-size: 0.95rem;
            transition: all 0.3s;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: var(--purple);
        }

        textarea {
            height: 120px;
            font-family: 'JetBrains Mono', monospace;
        }

        .btn-post {
            width: 100%;
            padding: 18px;
            background: var(--purple);
            color: white;
            border: none;
            border-radius: 14px;
            font-family: 'Sora', sans-serif;
            font-weight: 800;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-post:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(168, 85, 247, 0.3);
        }

        .preview-card {
            background: rgba(255, 255, 255, 0.03);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid var(--border);
            margin-bottom: 20px;
            text-align: center;
        }

        .preview-card img {
            max-width: 100%;
            height: 200px;
            object-fit: contain;
            border-radius: 8px;
            margin-bottom: 12px;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 0.7rem;
            font-weight: 800;
        }

        .status-reading {
            background: var(--green);
            color: black;
        }

        .status-finished {
            background: var(--purple);
            color: white;
        }

        @media (max-width: 1100px) {
            .container {
                grid-template-columns: 1fr;
            }

            body {
                height: auto;
                overflow: visible;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- Panel 1: Inventory -->
        <div class="panel inventory-panel">
            <div class="section-header">
                <h1>📚 Inventory</h1>
                <button class="btn-new" onclick="createNew()">+ New Book</button>
            </div>
            <div id="inventory-list" class="inventory-list">
                <p style="color: grey; font-size: 0.8rem;">Loading books...</p>
            </div>
        </div>

        <!-- Panel 2: Editor -->
        <div class="panel editor-panel">
            <h1>✍️ Editor</h1>
            <form id="bookForm">
                <input type="hidden" id="book-id">

                <div class="form-group">
                    <label>Book Title</label>
                    <input type="text" id="title" required placeholder="Dune">
                </div>

                <div class="form-group">
                    <label>Cover Image URL</label>
                    <input type="url" id="image" required placeholder="https://...">
                </div>

                <div class="form-group">
                    <label>Reading Status</label>
                    <select id="status">
                        <option value="Reading">📖 Currently Reading</option>
                        <option value="Finished">✅ Finished & Review</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Markdown URL (Legacy Sync)</label>
                    <input type="url" id="mdLink" placeholder="https://raw.githubusercontent.com/.../review.md">
                </div>

                <div class="form-group">
                    <label>Review Content (Markdown)</label>
                    <textarea id="content" placeholder="Write your review here..."></textarea>
                </div>

                <div class="form-group" style="display: flex; align-items: center; gap: 10px;">
                    <input type="checkbox" id="is_special" style="width: auto;">
                    <label style="margin-bottom: 0;">Special Recommendation</label>
                </div>

                <div class="form-group">
                    <label>Tags (Comma separated)</label>
                    <input type="text" id="tags" placeholder="Sci-Fi, Epic, Classic">
                </div>

                <div class="form-group">
                    <label>Secret Key</label>
                    <input type="password" id="secret" required placeholder="••••••••••••">
                </div>

                <div class="form-group" style="display: flex; gap: 10px;">
                    <button type="submit" id="submit-btn" class="btn-post">SALVAR LIVRO 🚀</button>
                    <button type="button" id="delete-btn" class="btn-post" style="background: #ef4444; display: none;"
                        onclick="deleteBook()">DELETAR 🗑️</button>
                </div>
            </form>
            <div id="status-msg"></div>
        </div>

        <!-- Panel 3: Preview -->
        <div class="panel preview-panel">
            <h1>👀 Preview</h1>
            <div class="preview-card">
                <img id="prev-img" src="https://via.placeholder.com/150x225?text=Cover" alt="Cover">
                <div id="prev-special" style="display: none; color: #fbbf24; font-size: 0.8rem; margin-bottom: 5px;">
                    <i class="fa-solid fa-star"></i> SPECIAL RECOMMENDATION
                </div>
                <h3 id="prev-title" style="margin: 10px 0;">Book Title</h3>
                <div id="prev-status" class="status-badge status-reading">READING</div>
                <p id="prev-tags" style="color: grey; font-size: 0.8rem; margin-top: 10px;">Tags: --</p>
            </div>

            <p style="color: grey; font-size: 0.8rem; text-transform: uppercase; font-weight: 700;">Review Sneak Peek
            </p>
            <div id="prev-desc"
                style="background: rgba(255,255,255,0.02); padding: 15px; border-radius: 8px; font-size: 0.9rem; color: #aaa; min-height: 100px; white-space: pre-wrap;">
                Currently reading this book...
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('bookForm');
        const titleInput = document.getElementById('title');
        const imageInput = document.getElementById('image');
        const statusInput = document.getElementById('status');
        const tagsInput = document.getElementById('tags');
        const idInput = document.getElementById('book-id');
        const mdInput = document.getElementById('mdLink');
        const inventoryEl = document.getElementById('inventory-list');

        let allBooks = [];

        async function fetchInventory() {
            try {
                const res = await fetch('/api/get-books');
                const data = await res.json();
                allBooks = data.data || [];
                renderInventory();
            } catch (err) {
                console.error('Failed to fetch inventory:', err);
                inventoryEl.innerHTML = '<p style="color:red">Failed to load inventory.</p>';
            }
        }

        function renderInventory() {
            if (allBooks.length === 0) {
                inventoryEl.innerHTML = '<p style="color:grey">No books in database yet.</p>';
                return;
            }

            inventoryEl.innerHTML = allBooks.map(book => `
                <div class="inventory-item ${idInput.value === book.id ? 'active' : ''}" onclick="editBook('${book.id}')">
                    <img src="${book.image}" alt="">
                    <div class="inventory-item-info">
                        <p class="inventory-item-title">${book.title}</p>
                        <span class="inventory-item-status" style="color: ${book.status === 'Reading' ? '#22c55e' : '#a855f7'}">${book.status}</span>
                        ${book.is_special ? ' <span style="color:#fbbf24">★</span>' : ''}
                    </div>
                </div>
            `).join('');
        }

        function editBook(id) {
            const book = allBooks.find(b => b.id === id);
            if (!book) return;

            idInput.value = book.id;
            titleInput.value = book.title;
            imageInput.value = book.image;
            statusInput.value = book.status;
            mdInput.value = book.md_link || '';
            tagsInput.value = (book.tags || []).join(', ');
            document.getElementById('content').value = book.content || '';
            document.getElementById('is_special').checked = book.is_special || false;

            document.getElementById('submit-btn').innerText = 'ATUALIZAR LIVRO 💾';
            document.getElementById('delete-btn').style.display = 'block';
            updatePreview();
            renderInventory();
        }

        function createNew() {
            idInput.value = '';
            form.reset();
            document.getElementById('content').value = '';
            document.getElementById('is_special').checked = false;
            document.getElementById('submit-btn').innerText = 'SALVAR NOVO LIVRO 🚀';
            document.getElementById('delete-btn').style.display = 'none';
            updatePreview();
            renderInventory();
        }

        async function deleteBook() {
            const id = idInput.value;
            const secret = document.getElementById('secret').value;
            if (!id || !secret) {
                alert('Missing ID or Secret Key');
                return;
            }

            if (!confirm(`Are you sure you want to delete "${titleInput.value}"? This will also cleanup GitHub assets.`)) {
                return;
            }

            const statusMsg = document.getElementById('status-msg');
            const deleteBtn = document.getElementById('delete-btn');

            statusMsg.style.display = 'none';
            deleteBtn.disabled = true;

            try {
                const response = await fetch('/api/books', {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id, secret })
                });

                const result = await response.json();

                if (response.ok) {
                    statusMsg.className = 'status-badge success';
                    statusMsg.innerText = 'Livro deletado com sucesso! Iniciando limpeza no GitHub...';
                    statusMsg.style.display = 'block';
                    await fetchInventory();
                    createNew();
                } else {
                    throw new Error(result.error || 'Failed to delete');
                }
            } catch (err) {
                statusMsg.className = 'status-badge error';
                statusMsg.innerText = 'Erro: ' + err.message;
                statusMsg.style.display = 'block';
            } finally {
                deleteBtn.disabled = false;
            }
        }

        function updatePreview() {
            document.getElementById('prev-title').innerText = titleInput.value || 'Book Title';
            document.getElementById('prev-img').src = imageInput.value || 'https://via.placeholder.com/150x225?text=Cover';

            const badge = document.getElementById('prev-status');
            const status = statusInput.value;
            badge.innerText = status.toUpperCase();
            badge.className = `status-badge status-${status.toLowerCase()}`;

            document.getElementById('prev-tags').innerText = 'Tags: ' + (tagsInput.value || '--');

            const isSpecial = document.getElementById('is_special').checked;
            document.getElementById('prev-special').style.display = isSpecial ? 'block' : 'none';

            const desc = document.getElementById('prev-desc');
            const content = document.getElementById('content').value;
            desc.innerText = content || (status === 'Reading'
                ? `Starting reading this book: ${titleInput.value || '...'}`
                : `Finished and reviewed: ${titleInput.value || '...'}`);
        }

        [titleInput, imageInput, statusInput, tagsInput, document.getElementById('content'), document.getElementById('is_special')].forEach(el => {
            el.addEventListener('input', updatePreview);
            if (el.type === 'checkbox') el.addEventListener('change', updatePreview);
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const statusMsg = document.getElementById('status-msg');
            const btn = document.getElementById('submit-btn');

            statusMsg.style.display = 'none';
            btn.disabled = true;

            const payload = {
                id: idInput.value || null,
                title: titleInput.value,
                image: imageInput.value,
                status: statusInput.value,
                mdLink: mdInput.value,
                tags: tagsInput.value.split(',').map(t => t.trim()).filter(t => t),
                content: document.getElementById('content').value,
                is_special: document.getElementById('is_special').checked,
                secret: document.getElementById('secret').value
            };

            try {
                const response = await fetch('/api/books', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();

                if (response.ok) {
                    statusMsg.className = 'status-badge success';
                    statusMsg.innerText = 'Salvo com sucesso! 🎉 Sincronizando com GitHub...';
                    statusMsg.style.display = 'block';

                    fetchInventory(); // Reload list
                    if (!idInput.value) {
                        createNew(); // Reset if it was a new post
                    }
                } else {
                    throw new Error(result.error || 'Check secret key');
                }
            } catch (err) {
                statusMsg.className = 'status-badge error';
                statusMsg.innerText = 'Erro: ' + err.message;
                statusMsg.style.display = 'block';
            } finally {
                btn.disabled = false;
            }
        });

        // Initial Load
        fetchInventory();
    </script>
</body>

</html>
